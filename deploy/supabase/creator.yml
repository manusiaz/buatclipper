# Stack creator (= db/creator/supabase/config.toml versi self-hosted): tanpa login sendiri (signup mati); token user diverifikasi
# lewat JWKS bersama (public key identity). Fungsi: bridge (penerima bus, HMAC per pengirim), social, track-worker, refresh-tokens
# (OAuth sosmed + token di Vault creator).
services:
  functions:
    environment:
      IDENTITY_ISSUER: ${IDENTITY_ISSUER}
      IDENTITY_JWKS_URL: ${IDENTITY_PUBLIC_URL}/auth/v1/.well-known/jwks.json
      APP_ORIGINS: ${APP_ORIGINS}
      BUS_SECRET_FROM_ADMIN: ${BUS_SECRET_FROM_ADMIN}
      BUS_SECRET_FROM_BRAND: ${BUS_SECRET_FROM_BRAND}
      SOCIAL_REDIRECT_ALLOWLIST: ${SOCIAL_REDIRECT_ALLOWLIST}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      THREADS_APP_ID: ${THREADS_APP_ID}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      X_CLIENT_ID: ${X_CLIENT_ID}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET}
