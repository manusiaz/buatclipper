# 5 app Next.js (satu image monorepo, deploy/app.Dockerfile). Env dari deploy/apps.env (ditulis deploy.sh, semua
# NEXT_PUBLIC_*: app tidak memegang secret, §15.7). Caddy terpisah (deploy/.generated/caddy.yml, per peran server).
# APP_IMAGE (config.env) = image yang sudah dibangun di tempat lain (mis. CI); kosong = dibangun di server ini.
x-app: &app
  image: ${APP_IMAGE:-clipper-apps:latest}
  restart: unless-stopped
  env_file: apps.env
  networks: [clipper]

services:
  web:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
      args:
        NEXT_PUBLIC_IDENTITY_URL: ${NEXT_PUBLIC_IDENTITY_URL}
        NEXT_PUBLIC_IDENTITY_PUBLISHABLE_KEY: ${NEXT_PUBLIC_IDENTITY_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL}
        NEXT_PUBLIC_CORE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CORE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BRAND_DB_URL: ${NEXT_PUBLIC_BRAND_DB_URL}
        NEXT_PUBLIC_BRAND_DB_PUBLISHABLE_KEY: ${NEXT_PUBLIC_BRAND_DB_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CREATOR_DB_URL: ${NEXT_PUBLIC_CREATOR_DB_URL}
        NEXT_PUBLIC_CREATOR_DB_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CREATOR_DB_PUBLISHABLE_KEY}
        NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
        NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_BRAND_URL: ${NEXT_PUBLIC_BRAND_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    command: [pnpm, --filter, ./apps/web, start]
  accounts:
    <<: *app
    command: [pnpm, --filter, ./apps/accounts, start]
  clipper:
    <<: *app
    command: [pnpm, --filter, ./apps/clipper, start]
  brand:
    <<: *app
    command: [pnpm, --filter, ./apps/brand, start]
  admin:
    <<: *app
    command: [pnpm, --filter, ./apps/admin, start]

networks:
  clipper:
    external: true
    name: clipper
