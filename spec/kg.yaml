# kg.yaml — registri entitas & state machine clipper platform v0.3 (produk penuh)
# Kolom & constraint: SQL db/*/supabase/schemas (Lampiran A PRD). fields/unique di bawah = salinan kolom SQL dari katalog
# database uji: jangan edit tangan, ubah SQL-nya. states = sumber trigger state machine (spec/gen_states.py).
# Peta fitur → host/URL/folder/tabel: spec/structure.yaml (Lampiran B). Peta node & edge: KNOWLEDGE_GRAPH.md
dbs:  # D-12 · §15.4 — tidak ada foreign key lintas DB; rujukan lintas DB = refs
  identity: {schemas: [member, api], pii: true, auth_issuer: true, host: "auth.{domain}"}
  core: {schemas: [market, tracking, finance, trust, ops, api], pii: false}
entities:
  E-01: {table: profiles, db: core.market, fields: [id, username, display_name, avatar_path, trust_score, status, suspended_until, referral_code, created_at], has_many: [E-04, E-11, E-17, E-18, E-23], unique: [referral_code, username]}  # id = sub JWT identity; profil publik, tanpa PII
  E-02: {table: organizations, db: core.market, fields: [id, name, org_type, legal_name, npwp, address, is_agency, fee_rule_id, status, verified_by, verified_at, created_by, created_at], has_many: [E-03, E-06, E-22, E-30]}  # data badan; PIC = anggota E-03 brand_owner; brand perorangan → KYC E-05 pemiliknya (NPWP = NIK)
  E-03: {table: org_members, db: core.market, fields: [org_id, user_id, role, added_by, created_at], belongs_to: [E-01, E-02]}
  E-04: {table: social_accounts, db: core.tracking, fields: [id, user_id, platform, external_id, handle, token_ref, status, followers, platform_created_at, verified_at, created_at], unique: ["id+user_id+platform", "platform+external_id"], belongs_to: [E-01], has_many: [E-12]}  # token_ref → Vault core; satu akun sosmed = satu clipper
  E-05: {table: kyc_records, db: identity.member, fields: [id, user_id, nik_hash, nik_enc, nik_last4, enc_key_version, legal_name, doc_ref, status, reject_reason, submitted_at, decided_at, decided_by, blocked, retain_until], unique: [nik_hash, user_id], refs: [E-01]}  # nik_hash = HMAC berkunci; nik_enc untuk bukti potong PPh 21 (§5.4); doc_ref → bucket kyc-docs
  E-06: {table: campaigns, db: core.market, fields: [id, org_id, slug, title, type, category_id, status, platforms, brief, required_hashtags, required_mentions, required_links, sponsored_label, min_duration_sec, max_duration_sec, dos, donts, example_urls, faq, service_mode, start_at, submit_deadline, view_window_days, review_mode, min_followers, min_account_age_days, min_trust_score, kyc_required, min_views, max_clips_per_clipper, clipper_quota, allow_video_reuse, visibility, is_template, fee_rule_id, pinned_until, pinned_rank, created_by, created_at], belongs_to: [E-02], has_many: [E-08, E-09, E-10, E-11], unique: [slug]}
  E-07: {table: reward_types, db: core.market, fields: [id, owner_org_id, code, name, kind, unit_label, idr_value_per_unit, decimals, fulfillment, recipient_schema, stock, webhook_url, webhook_secret_ref, fulfillment_margin_pct, created_at], unique: ["owner_org_id+code"]}  # field penerima ber-flag pii → nilainya di E-29
  E-08: {table: rate_rules, db: core.market, fields: [id, campaign_id, kind, reward_type_id, pool_id, platform, params, effective_from, effective_to], belongs_to: [E-06, E-07, E-09]}
  E-09: {table: reward_pools, db: core.finance, fields: [id, campaign_id, reward_type_id, total, allocated, max_per_clip], belongs_to: [E-06, E-07], rule: "allocated = cache saldo akun campaign_pool (E-14); hanya ditulis fungsi finance (accrue_earnings, reverse_earning) dalam transaksi yang sama dengan jurnal E-15", unique: ["id+campaign_id+reward_type_id"]}
  E-10: {table: campaign_assets, db: core.market, fields: [id, campaign_id, kind, storage_path, url, size_bytes, audience, created_at], belongs_to: [E-06]}  # kind cover → bucket campaign-covers (publik); aset brief → campaign-assets (privat); audience internal = berkas brief brand di folder internal/ (anggota org & admin)
  E-11: {table: claims, db: core.market, fields: [id, campaign_id, user_id, status, expires_at, reminded_at, created_at], belongs_to: [E-06, E-01], has_many: [E-12], unique: ["id+user_id+campaign_id", "campaign_id+user_id WHERE (status = 'open'::market.claim_status)"]}
  E-12: {table: submissions, db: core.tracking, fields: [id, claim_id, user_id, campaign_id, social_account_id, platform, post_id, url, posted_at, status, counted_views, last_snapshot_at, next_poll_at, locked_at, created_at], unique: [claim_id, "campaign_id+platform+post_id"], belongs_to: [E-11, E-04], has_many: [E-13]}  # kunci video = platform + post_id per campaign (bukan URL); lintas campaign dicek submit sesuai allow_video_reuse
  E-13: {table: view_snapshots, db: core.tracking, append_only: true, fields: [id, submission_id, taken_at, views, likes, comments, shares, is_final, raw], belongs_to: [E-12], unique: ["submission_id+taken_at", "submission_id WHERE is_final"]}
  E-14: {table: ledger_accounts, db: core.finance, fields: [id, owner_type, owner_id, reward_type_id, created_at], unique: ["id+reward_type_id", "owner_type+owner_id+reward_type_id"]}  # owner_type: user_wallet | campaign_pool | platform_revenue | bank_clearing | tax_payable
  E-15: {table: ledger_entries, db: core.finance, append_only: true, fields: [id, txn_id, account_id, reward_type_id, amount, state, ref_type, ref_id, created_at], rule: "sum(amount) per txn_id = 0", unique: ["ref_type+ref_id+account_id+state"]}
  E-16: {table: payout_methods, db: identity.member, fields: [id, user_id, kind, bank_code, account_no_hash, account_no_enc, account_last4, account_name, enc_key_version, verified_at, disabled_at, blocked, created_at], unique: ["bank_code+account_no_hash"], refs: [E-01]}  # hash = HMAC berkunci; nama rekening = E-05.legal_name user yang sama
  E-17: {table: payouts, db: core.finance, fields: [id, user_id, method_id, batch_id, amount, fee, channel, status, hold_reason, bank_ref, proof_ref, provider_ref, idempotency_key, created_at, paid_at], belongs_to: [E-01, E-26], refs: [E-16], unique: [idempotency_key, provider_ref]}  # proof_ref → bucket payout-proofs (identity)
  E-18: {table: fulfillments, db: core.finance, fields: [id, user_id, reward_type_id, amount, recipient, recipient_ref, status, delivered_ref, attempts, last_error, next_retry_at, idempotency_key, created_at, delivered_at], belongs_to: [E-01, E-07], refs: [E-29], unique: [idempotency_key]}  # recipient = ID game dll; alamat/HP → E-29
  E-19: {table: review_decisions, db: core.trust, fields: [id, target_type, target_id, actor_id, decision, reason_code, message, note, created_at], unique: ["target_id WHERE ((target_type = 'submission'::text) AND (decision = 'appeal'::text))"]}
  E-20: {table: fraud_flags, db: core.trust, fields: [id, target_type, target_id, signal, score, status, details, resolved_by, resolved_at, created_at], unique: ["target_type+target_id+signal WHERE (status = ANY (ARRAY['open'::text, 'held'::text]))"]}
  E-21: {table: fee_rules, db: core.finance, fields: [id, scope, mgmt_fee_pct, admin_fee_pct, clipper_fee_pct, instant_withdraw_fee, created_by, created_at], unique: ["scope WHERE (scope = 'global'::text)"]}
  E-22: {table: invoices, db: core.finance, fields: [id, number, org_id, campaign_id, kind, subtotal, mgmt_fee, admin_fee, service_fee, tax, total, status, payment_channel, payment_ref, paid_amount, paid_at, confirmed_by, faktur_no, issued_at, due_at, pin_until], belongs_to: [E-02, E-06], unique: [faktur_no, number, payment_ref]}
  E-23: {table: notifications, db: core.ops, fields: [id, user_id, event, payload, read_at, created_at]}  # in-app; email dikirim identity (§15.5 alur 4)
  E-24: {table: audit_logs, db: [core.ops, identity.member], append_only: true, fields: [id, actor_id, action, target, before, after, at]}  # tiap DB mencatat aksinya sendiri; akses PII tercatat di identity
  E-25: {table: settings, db: core.ops, fields: [key, value, updated_by, updated_at]}
  E-26: {table: payout_batches, db: core.finance, fields: [id, created_by, approved_by, status, cutoff_at, total, count, file_ref, executed_at, created_at], has_many: [E-17]}  # batch transfer manual; file_ref → bucket pii-exports (identity)
  E-27: {table: platform_roles, db: identity.member, fields: [user_id, role, granted_by, granted_at], refs: [E-01]}  # sumber claim app_roles (custom access token hook)
  E-28: {table: consents, db: identity.member, fields: [id, user_id, kind, version, granted_at, revoked_at], refs: [E-01], unique: ["user_id+kind+version"]}  # kind: tos | privacy | kyc | share_with_brand
  E-29: {table: recipient_details, db: identity.member, fields: [id, user_id, reward_type_id, data_enc, enc_key_version, updated_at], refs: [E-01, E-07], unique: ["user_id+reward_type_id"]}  # alamat/HP penerima reward non-tunai
  E-30: {table: org_invites, db: core.market, fields: [id, org_id, role, token_hash, expires_at, accepted_by, accepted_at, created_by, created_at], belongs_to: [E-02], unique: [token_hash]}  # tanpa email; link dibagikan brand_owner (alur 5)
  E-31: {table: legal_versions, db: identity.member, fields: [kind, version, published_at, url]}  # versi ToS/privasi yang terbit; consent hanya untuk versi terbaru; sumber claim consent_ok
  E-32: {table: categories, db: core.market, fields: [id, name_id, name_en, sort, active], has_many: [E-06]}  # kategori campaign (F-A04)
  E-33: {table: report_links, db: core.market, fields: [id, campaign_id, token_hash, created_by, expires_at, revoked_at, created_at], unique: [token_hash], belongs_to: [E-06, E-01]}  # link laporan read-only {domain}/r/[token], hanya sha256 token (F-B09)
  E-34: {table: notification_prefs, db: core.ops, fields: [user_id, email_promotions, updated_at], belongs_to: [E-01]}  # email promosi on/off; email transaksional selalu terkirim
  E-35: {table: org_refunds, db: core.finance, fields: [id, org_id, campaign_id, amount, transfer_fee, status, requested_by, approved_by, bank_ref, proof_ref, idempotency_key, created_at, paid_at], unique: [idempotency_key], belongs_to: [E-02, E-06]}  # refund sisa budget (D-09); rollover = jurnal org_credit; dua orang
  E-36: {table: push_subscriptions, db: identity.member, fields: [id, user_id, endpoint, p256dh, auth_secret, created_at, last_used_at], unique: [endpoint], refs: [E-01]}  # langganan web push PWA; endpoint = pengenal perangkat → identity
  E-37: {table: campaign_invites, db: core.market, fields: [campaign_id, user_id, invited_by, created_at], belongs_to: [E-06, E-01]}  # undangan campaign privat (F-B11)
  E-38: {table: org_links, db: core.market, fields: [agency_org_id, client_org_id, approved_by, approved_at, revoked_at, created_at], belongs_to: [E-02]}  # tautan agency → org klien, disetujui brand_owner klien (F-B12)
  E-39: {table: referrals, db: core.market, fields: [referred_id, referrer_id, code, qualified_at, bonus_until, created_at], belongs_to: [E-01]}  # referral F-C16; bonus dibayar platform lewat ledger
  E-40: {table: score_events, db: core.trust, fields: [id, user_id, delta, reason, ref_id, created_by, created_at], belongs_to: [E-01]}  # riwayat Trust Score append-only (F-C12)
  E-41: {table: reward_codes, db: core.finance, fields: [id, reward_type_id, code, fulfillment_id, uploaded_by, created_at, assigned_at], unique: [fulfillment_id, "reward_type_id+code"], belongs_to: [E-07, E-18]}  # pool kode voucher; satu kode = satu fulfillment (F-B03)
  E-42: {table: broadcasts, db: core.ops, fields: [id, title, body, segment, channels, created_by, scheduled_at, sent_at, recipient_count, created_at]}  # broadcast ke segmen clipper (F-A12)
states:  # state: [state tujuan yang diizinkan]
  S-01 campaign: {draft: [in_review, cancelled], in_review: [scheduled, rejected, cancelled], rejected: [draft], scheduled: [live, cancelled], live: [paused, tracking, exhausted], paused: [live, tracking, exhausted], tracking: [settling, exhausted], exhausted: [settling], settling: [settled]}
  S-02 claim: {open: [submitted, expired, released]}
  S-03 submission: {validating: [in_review, tracking, rejected], in_review: [tracking, rejected], rejected: [appealed], appealed: [tracking, rejected_final], tracking: [flagged, forfeited, locked], flagged: [tracking, forfeited], locked: [settled]}
  S-04 earning: {pending: [available, reversed], available: [withdrawn]}
  S-05 payout: {requested: [on_hold, processing], on_hold: [processing, cancelled], processing: [paid, failed], failed: [requested, returned]}
  S-06 fulfillment: {requested: [on_hold, processing], on_hold: [processing, cancelled], processing: [delivered, failed], failed: [requested, returned]}
