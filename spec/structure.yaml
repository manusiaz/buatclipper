  F-C02: {name: "Connect akun sosmed", folders: [clipper/social], pages: ["page:app/social"], db: [tracking.social_accounts, vault.social-tokens], fn: [core/social, api.store_social_token]}
  F-C03: {name: "Campaign list", folders: [clipper/campaigns], pages: ["page:app/campaigns"], db: [market.campaigns, finance.reward_pools, market.categories], fn: [api.list_campaigns]}
  F-C04: {name: "Detail & instruksi", folders: [clipper/campaigns], pages: ["page:app/campaigns/[id]"], db: [market.campaigns, market.rate_rules, market.campaign_assets, bucket.campaign-assets], fn: []}
  F-C05: {name: "Claim", folders: [clipper/claim], pages: ["page:app/campaigns/[id]"], db: [market.claims], fn: [api.claim_campaign]}
