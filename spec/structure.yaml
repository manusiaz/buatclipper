# structure.yaml — sumber tunggal struktur domain → URL → folder → fitur (PRD §15.2–15.3 + Lampiran B, bagian Struktur di
# KNOWLEDGE_GRAPH.md). Kolom DB tidak ditulis di sini: sumbernya file SQL di db/ (Lampiran A dibangkitkan dari katalognya).
hosts:
  - host: "{domain}"
    app: web
    dns: "A @ → IP dari kartu domain project Vercel web (umumnya 76.76.21.21; project baru bisa dapat IP anycast lain)"
    role: "Landing, legal, campaign publik, laporan read-only, link referral (?ref=)"
    index: "diindeks (sitemap.xml, robots.txt)"
  - host: "www.{domain}"
    app: web
    dns: "CNAME www → target CNAME unik project web (dari Vercel)"
    role: "Redirect 308 ke {domain} (domain kanonik)"
    index: "tidak (redirect)"
  - host: "accounts.{domain}"
    app: accounts
    dns: "CNAME accounts → target CNAME unik project accounts"
    role: "Login, onboarding, hub akun, KYC, rekening, MFA, privasi, terima undangan; menulis cookie SSO .{domain}"
    index: "noindex (header X-Robots-Tag)"
  - host: "app.{domain}"
    app: clipper
    dns: "CNAME app → target CNAME unik project clipper"
    role: "App clipper (PWA), redirect URI OAuth sosmed"
    index: "noindex"
  - host: "brand.{domain}"
    app: brand
    dns: "CNAME brand → target CNAME unik project brand"
    role: "App brand & agency per org"
    index: "noindex"
  - host: "admin.{domain}"
    app: admin
    dns: "CNAME admin → target CNAME unik project admin"
    role: "Back-office; cookie host-only; halaman di balik IP allowlist/zero-trust"
    index: "noindex"
  - host: "auth.{domain}"
    app: "Supabase identity"
    dns: "CNAME auth → <ref-identity>.supabase.co; TXT _acme-challenge.auth (nilai dari Supabase)"
    role: "Custom domain Auth identity: consent screen Google, issuer JWT; callback Google https://auth.{domain}/auth/v1/callback"
    index: "tidak (API)"
  - host: "notif.{domain}"
    app: "Resend (email)"
    dns: "MX send.notif → feedback-smtp.<region>.amazonses.com (prio 10); TXT send.notif v=spf1 include:amazonses.com ~all; TXT resend._domainkey.notif (DKIM dari Resend)"
    role: "Subdomain pengirim: OTP login (SMTP Auth identity) + notifikasi; From no-reply@notif.{domain}"
    index: "tidak (email)"
  - host: "_dmarc.{domain}"
    app: "DNS"
    dns: "TXT v=DMARC1; p=none; rua=mailto:dmarc@{domain} → naik ke quarantine setelah laporan bersih"
    role: "Kebijakan DMARC domain utama (berlaku juga untuk subdomain pengirim)"
    index: "tidak"

