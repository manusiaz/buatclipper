  F-C07: {name: "Tugas Saya", folders: [clipper/tasks], pages: ["page:app/tasks"], db: [market.claims, tracking.submissions, tracking.view_snapshots, trust.review_decisions], fn: [api.appeal_submission]}
  F-C08: {name: "Wallet", folders: [clipper/wallet], pages: ["page:app/wallet"], db: [finance.ledger_accounts, finance.ledger_entries, finance.reward_codes], fn: []}
  F-C09: {name: "Withdraw & klaim reward", folders: [clipper/withdraw, accounts/payout-methods], pages: ["page:app/wallet/withdraw", "page:accounts/payout-methods"], db: [finance.payouts, finance.fulfillments, member.payout_methods, member.recipient_details], fn: [api.request_payout, api.request_fulfillment, api.my_payout_methods, identity/member-data]}
  F-C10: {name: "KYC", folders: [accounts/kyc], pages: ["page:accounts/kyc"], db: [member.kyc_records, bucket.kyc-docs, member.consents], fn: [identity/member-data, api.store_kyc]}
  F-C11: {name: "Notifikasi", folders: [clipper/notifications], pages: ["page:app/notifications", "page:app/settings"], db: [ops.notifications, ops.notification_prefs], fn: [ops.enqueue_notification, core/notify, identity/bridge]}
  F-C12: {name: "Profil & Trust Score", folders: [clipper/profile], pages: ["page:app/profile"], db: [market.profiles, trust.score_events], fn: [trust.recalc_scores]}
