      do: Export data penerima, kirim ke brand atau isi kode, Tandai terkirim.
      sys: pii-export membuat CSV penerima hanya untuk user dengan consent share_with_brand (E-28); status E-18 delivered → notifikasi Reward terkirim.
      nodes:
      - api:fn identity/pii-export
      - table:finance.fulfillments
      - fn:enqueue_notification
      next: []
      next_note: Clipper melihat status di app.{domain}/wallet.
      branch: Tanpa consent share_with_brand → tidak ikut export, user diminta memberi consent.
