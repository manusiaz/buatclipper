journeys:
  J-C1:
    title: 'Clipper baru: landing → daftar → campaign pertama → dibayar (browser HP)'
    persona: Clipper
    lanes:
    - '{domain}'
    - accounts.{domain}
    - app.{domain}
    - Platform sosmed
    - Tim internal & sistem
    steps:
    - id: C1.1
      lane: 0
      label: Landing
      page: page:www/
      url: '{domain}/'
      see: Hero (ambil campaign, posting di akun sendiri, dibayar per views), contoh cuan 10.000 views = Rp20.000, campaign live terbaru (cover, rate per
        platform, sisa budget dalam views), cara bayar, FAQ, tombol Mulai jadi clipper dan Untuk brand. Link dari teman berbentuk {domain}/?ref=<kode>.
      do: Tap Mulai jadi clipper, atau tap card campaign.
      sys: Card dibaca dari view publik schema api core (anon). Tidak ada script pihak ketiga selain analytics. Kode ?ref disimpan di cookie .{domain} 30
        hari.
      nodes:
      - table:market.campaigns
      - policy:core.public-read
      next:
      - page:accounts/login
      next_note: 'accounts.{domain}/login?next=https://app.{domain}/campaigns (dari card: next=…/campaigns/[id]).'
      branch: Untuk brand → J-B1. Cookie sesi sudah ada → tombol jadi Buka app → app.{domain}/campaigns.
    - id: C1.2
      lane: 1
      label: Login (OTP / Google)
      page: page:accounts/login
      url: accounts.{domain}/login?next=…
      see: Kolom email, tombol Lanjut dengan Google, CAPTCHA Turnstile (biasanya tidak terlihat), link ToS dan privasi.
      do: Isi email → Kirim kode → ketik 6 digit kode dari email. Atau tap Google → pilih akun.
      sys: 'Auth identity: signInWithOtp + token CAPTCHA; user baru dibuat otomatis; kode dikirim lewat SMTP Resend (template {{ .Token }}). verifyOtp →
        cookie sesi .{domain} diset dari server. Google: PKCE → layar izin Google (domain auth.{domain}) → accounts.{domain}/auth/callback menukar code
        jadi sesi. next dicek ke allowlist host.'
      nodes:
      - mod:auth
      - ext:supabase-identity
      - ext:turnstile
      - ext:resend
      - ext:google
      - api:GET accounts/auth/callback
      next:
      - page:accounts/onboarding
      - api:GET accounts/auth/callback
      next_note: Belum onboarding → accounts.{domain}/onboarding?next=…; sudah → next.
      branch: Kode salah/kedaluwarsa → kirim ulang (jeda sesuai rate limit Auth). Email tidak masuk → cek spam atau pakai Google. Akun ber-role admin →
        ditolak, diarahkan ke admin.{domain}.
    - id: C1.3
      lane: 1
      label: Onboarding
      page: page:accounts/onboarding
      url: accounts.{domain}/onboarding?role=clipper&next=…
      see: Username (dicek unik saat diketik), nama tampilan, foto (opsional, bucket avatars), centang Saya berusia 18 tahun atau lebih, ToS clipper + kebijakan
        privasi (termasuk data diproses di Singapura).
      do: Isi, centang, tap Simpan & mulai.
      sys: 'Urutan: core api.ensure_profile(username, nama, kode referral dari cookie) → E-01 (+ E-39 kalau kodenya sah) → identity api.record_consent untuk
        tos_clipper, privacy (hanya versi terbaru di E-31) dan age_18_plus → E-28 → refreshSession supaya claim consent_ok.clipper = true. Consent ditulis
        paling akhir: gagal di tengah jalan = kembali ke onboarding, tidak pernah masuk app tanpa profil.'
      nodes:
      - api:rpc core.ensure_profile
      - table:market.profiles
      - table:market.referrals
      - table:bucket.avatars
      - api:rpc identity.record_consent
      - table:member.consents
      - table:member.legal_versions
      - fn:custom_access_token_hook
      next:
      - page:app/campaigns
      next_note: 'next (default app.{domain}/campaigns). Target F-C01: landing sampai sini ≤ 2 menit.'
      branch: Username dipakai → pesan inline + saran. Belum 18 tahun → tidak bisa lanjut (data anak wajib persetujuan orang tua, UU PDP Pasal 25); umur
        dicek lagi dari NIK saat KYC. Tutup di tengah jalan → login berikutnya kembali ke onboarding.
    - id: C1.4
      lane: 2
      label: Daftar campaign
      page: page:app/campaigns
      url: app.{domain}/campaigns
      see: 'Banner Hubungkan akun sosmed dulu supaya bisa ambil campaign (selama belum ada akun). List: search, filter platform/status/kategori, sort, card
        dengan CTA 6 state (F-C03). Nav bawah: Campaign, Tugas, Wallet, Sosmed.'
      do: Tap banner (ke Sosmed) atau buka card.
      sys: proxy.ts membaca cookie SSO dan menyegarkan sesi; client core memakai access token identity (Custom OIDC). Campaign + eligibility per user dari
        view schema api core (RLS).
      nodes:
      - mod:auth
      - mod:db-core
      - table:market.campaigns
      - table:tracking.social_accounts
      next:
      - page:app/social
      - page:app/campaigns/[id]
      - page:app/login
      next_note: app.{domain}/social atau app.{domain}/campaigns/[id].
      branch: Tidak ada sesi / sesi dicabut → app.{domain}/login?next=/campaigns (J-C2).
    - id: C1.5
      lane: 2
      label: Hubungkan sosmed
      page: page:app/social
      url: app.{domain}/social
      see: 'Kartu TikTok, Instagram, Threads, YouTube: Belum terhubung / Terverifikasi / Token kedaluwarsa / Dicabut, tombol Hubungkan atau Reconnect, maks
        3 akun per platform.'
      do: Tap Hubungkan TikTok → login & setujui izin di halaman resmi TikTok.
      sys: App membuat state anti-CSRF → halaman izin platform (TikTok Login Kit / Instagram Login / Threads / Google OAuth) → platform redirect ke app.{domain}/api/oauth/[platform]/callback
        → Edge Function core social menukar code, token ke Vault core, akun ke E-04 (handle, follower, Terverifikasi).
      nodes:
      - ext:tiktok
      - ext:meta
      - ext:google
      - api:GET app/api/oauth/[platform]/callback
      - api:fn creator/social
      - table:vault.social-tokens
      - table:tracking.social_accounts
      next:
      - api:GET app/api/oauth/[platform]/callback
      next_note: Kembali ke app.{domain}/social?connected=tiktok (toast sukses), lalu ke campaign.
      branch: Instagram personal → ditolak + panduan pindah ke Creator. Batal di halaman platform → pesan batal. Akun sosmed sudah terhubung ke clipper
        lain → ditolak (unik platform + external_id). Akun ke-4 di satu platform → ditolak.
    - id: C1.6
      lane: 2
      label: Detail & claim
      page: page:app/campaigns/[id]
      url: app.{domain}/campaigns/[id]
      see: Brief, do/don't, contoh, aset (unduh), hashtag/mention wajib, label konten bersponsor, rate & cap per platform, timeline tanggal absolut, FAQ,
        tombol Ambil Campaign.
      do: Tap Ambil Campaign.
      sys: 'Core api.claim_campaign: cek status E-01, eligibility (akun platform terhubung, follower, umur akun, Trust Score, KYC kalau disyaratkan), slot
        & kuota, bukan anggota org pemilik campaign, campaign privat hanya untuk yang diundang/levelnya cukup, belum ada claim terbuka → E-11 open, kedaluwarsa
        48 jam. Aset brief lewat signed URL bucket campaign-assets; berkas internal brand tidak terlihat.'
      nodes:
      - api:rpc core.claim_campaign
      - table:market.claims
      - table:market.profiles
      - table:bucket.campaign-assets
      next:
      - page:app/social
      - page:accounts/kyc
      next_note: 'Tetap di halaman ini: tombol berubah jadi Submit video + hitung mundur 48 jam.'
      branch: 'Tidak eligible → alasan + aksi: Hubungkan akun (→ /social?next=…) atau Lengkapi KYC (→ accounts.{domain}/kyc?next=…). Slot penuh / budget
        habis / deadline lewat → tombol nonaktif + alasan. Anggota org pemilik campaign → ditolak (konflik kepentingan).'
    - id: C1.7
      lane: 3
      label: Posting video
      page: ext:tiktok
      url: Aplikasi TikTok / Instagram / Threads / YouTube
      see: Aplikasi platform milik clipper.
      do: 'Posting klip sesuai brief: hashtag/mention wajib, setelan konten bersponsor/paid promotion.'
      sys: Belum ada. job:claim-expiry mengirim pengingat sebelum 48 jam habis (in-app + email).
      nodes:
      - job:claim-expiry
      - fn:enqueue_notification
      next: []
      next_note: Kembali ke app.{domain}/campaigns/[id] (tab yang masih terbuka, notifikasi, atau Tugas).
      branch: Claim kedaluwarsa → slot dilepas (S-02 expired); bisa claim ulang kalau slot masih ada.
    - id: C1.8
      lane: 2
      label: Submit video
      page: page:app/campaigns/[id]
      url: app.{domain}/campaigns/[id] (sheet Submit video)
      see: 'Daftar video dari akun terhubung yang diposting setelah claim (thumbnail, caption, tanggal); video yang captionnya kurang tag wajib
        sudah ditandai sebelum Submit (mis. kurang #mplid); link Tempel URL sebagai cadangan.'
      do: Pilih video → Submit.
      sys: 'Edge Function core social mengambil daftar video lewat API platform lalu validasi: milik akun ini, platform diizinkan, diposting setelah claim,
        hashtag/mention/link wajib ada (api.missing_brief_tags), durasi sesuai brief (API tanpa durasi → review manual), video belum pernah disubmit di
        campaign ini → E-12 validating → in_review (review manual) atau tracking (auto); E-11 submitted.'
      nodes:
      - api:fn creator/social
      - api:rpc core.missing_brief_tags
      - table:tracking.submissions
      - table:market.claims
      next:
      - page:app/tasks
      next_note: app.{domain}/tasks + toast Submisi masuk.
      branch: 'Tiap gagal punya pesan sendiri: bukan video milikmu, hashtag/mention/link kurang (disebut satu per satu, mis. #mplid), durasi di luar
        brief, sudah pernah disubmit, diposting sebelum claim, platform tidak diizinkan.'
    - id: C1.9
      lane: 2
      label: Tugas Saya
      page: page:app/tasks
      url: app.{domain}/tasks
      see: Claim & submisi per status (Validasi, Review, Tracking, Ditolak, Banding, Terkunci), views terakhir + jam update, earning pending per submisi,
        alasan reject, tombol Banding (1×).
      do: Pantau; tap Banding kalau ditolak.
      sys: job:track-due (pg_cron 15 menit) → queue → track-worker ambil metrik (jadwal 4/24/72 jam) → E-13 snapshot → accrue_earnings → jurnal E-15 Pending.
        Review admin (F-A05) atau brand (F-B07, auto-approve 72 jam). Banding → api.appeal_submission (1× per submisi, unique index). Notifikasi in-app E-23
        + email/push lewat identity (alur 4).
      nodes:
      - job:track-due
      - api:fn creator/track-worker
      - table:tracking.view_snapshots
      - fn:accrue_earnings
      - table:finance.ledger_entries
      - api:rpc core.record_review
      - table:ops.notifications
      - api:fn core/notify
      - api:fn identity/bridge
      - api:rpc core.appeal_submission
      next:
      - page:app/wallet
      - page:app/social
      next_note: app.{domain}/wallet.
      branch: Ditolak → Banding → antre moderasi (J-A4). Fraud flag → earning ditahan. Post dihapus/diprivate → earning hangus + notifikasi. Token dicabut
        → tracking pause + tombol Reconnect → /social.
    - id: C1.10
      lane: 2
      label: Wallet
      page: page:app/wallet
      url: app.{domain}/wallet
      see: 'Saldo per unit (Rp, Diamonds, dll): Pending / Tersedia / Ditarik + riwayat transaksi. Tab Reward: kode voucher yang sudah dikirim.'
      do: Tap Tarik saat Tersedia ≥ minimum (Rp100.000, config).
      sys: job:lifecycle mengunci submisi di akhir view window; job:earning-release memindah Pending → Tersedia setelah lock + hold 7 hari tanpa fraud flag
        → notifikasi earning tersedia.
      nodes:
      - job:lifecycle
      - job:earning-release
      - table:finance.ledger_entries
      - table:finance.reward_codes
      next:
      - page:app/wallet/withdraw
      next_note: app.{domain}/wallet/withdraw.
      branch: Masih Pending → tampil tanggal perkiraan Tersedia.
    - id: C1.11
      lane: 2
      label: Withdraw
      page: page:app/wallet/withdraw
      url: app.{domain}/wallet/withdraw
      see: 'Checklist: KYC (dari claim kyc), rekening (tersamar ****1234 dari identity), jumlah, pilihan Batch mingguan (gratis) atau Instant (biaya flat,
        Trust Score ≥ ambang config); tab reward non-tunai.'
      do: Lengkapi KYC atau rekening kalau belum; pilih rekening + jumlah → Ajukan.
      sys: 'Identity api.my_payout_methods (alur 8: last4 + nama bank saja). Core api.request_payout(method_id, jumlah): cek status E-01, saldo, minimum
        → E-17 requested + jurnal. Non-tunai: api.request_fulfillment → E-18. Instant → bridge identity disburse ke penyedia disbursement (alur 11), tanpa
        menunggu batch.'
      nodes:
      - fn:custom_access_token_hook
      - api:rpc identity.my_payout_methods
      - api:rpc core.request_payout
      - table:finance.payouts
      - api:rpc core.request_fulfillment
      - api:fn identity/disburse
      next:
      - page:accounts/kyc
      - page:accounts/payout-methods
      - page:app/wallet
      next_note: Sukses → app.{domain}/wallet dengan status Menunggu batch (tanggal).
      branch: KYC belum → accounts.{domain}/kyc?next=https://app.{domain}/wallet/withdraw. Rekening belum → accounts.{domain}/payout-methods?next=…. Saldo
        < minimum → tombol nonaktif + kekurangannya. Akun disuspend → ditolak + kontak bantuan. Instant gagal di penyedia → saldo kembali, bisa pilih batch.
    - id: C1.12
      lane: 1
      label: KYC (sekali)
      page: page:accounts/kyc
      url: accounts.{domain}/kyc?next=…
      see: Status (Belum / Menunggu verifikasi / Disetujui / Ditolak + alasan), form nama sesuai KTP, NIK, foto KTP, persetujuan KYC.
      do: Isi, unggah foto, Kirim.
      sys: 'Foto ke bucket kyc-docs (folder milik user). Edge Function member-data: cek umur dari NIK (digit 7–12 = tanggal lahir, perempuan +40; < 18 tahun
        ditolak), HMAC NIK (UNIQUE) + enkripsi → E-05 menunggu; consent kyc (E-28). Admin memutus di J-A2 → notifikasi KYC disetujui/ditolak (in-app + email);
        claim kyc berubah saat JWT di-refresh (≤ 10 menit).'
      nodes:
      - table:bucket.kyc-docs
      - api:fn identity/member-data
      - table:member.kyc_records
      - table:member.consents
      next:
      - page:accounts/payout-methods
      - page:app/wallet/withdraw
      next_note: Tombol Kembali ke app → next (withdraw); bisa langsung lanjut ke rekening.
      branch: NIK sudah dipakai akun lain → ditolak (FR-04) + kontak bantuan. Ditolak admin (foto buram, nama beda) → perbaiki & kirim ulang. Umur dari
        NIK < 18 tahun → ditolak.
    - id: C1.13
      lane: 1
      label: Rekening (sekali)
      page: page:accounts/payout-methods
      url: accounts.{domain}/payout-methods?next=…
      see: Daftar rekening tersamar; form bank + nomor rekening + nama pemilik; data penerima reward fisik (alamat/HP) bila perlu.
      do: Simpan.
      sys: 'member-data: nama pemilik wajib sama dengan nama KYC; HMAC nomor (UNIQUE bank + nomor, FR-04) + enkripsi → E-16 (last4 untuk tampilan).'
      nodes:
      - api:fn identity/member-data
      - table:member.payout_methods
      - table:member.recipient_details
      next:
      - page:app/wallet/withdraw
      next_note: next → kembali ke app.{domain}/wallet/withdraw dengan rekening terpilih.
      branch: Nama beda dari KYC → ditolak dengan pesan. Rekening sudah dipakai akun lain → ditolak (FR-04).
    - id: C1.14
      lane: 4
      label: Batch & transfer
      page: page:admin/finance
      url: admin.{domain}/finance (tim finance, J-A3)
      see: Clipper tidak melihat apa-apa di langkah ini.
      do: Finance memproses batch mingguan.
      sys: create_payout_batch → approve orang kedua → pii-export CSV → transfer massal di internet banking → bukti diunggah → mark_batch_paid → jurnal
        Ditarik → notifikasi Payout sukses/gagal (in-app + email).
      nodes:
      - api:rpc core.create_payout_batch
      - api:fn identity/pii-export
      - ext:bank
      - api:rpc core.mark_batch_paid
      - fn:enqueue_notification
      next: []
      next_note: 'Clipper: notifikasi → app.{domain}/wallet (Ditarik bertambah).'
      branch: Gagal (rekening tutup / nama beda) → payout failed → saldo kembali; user memperbaiki rekening lalu ajukan ulang (S-05).
  J-C2:
    title: Clipper kembali lagi & kelola akun
    persona: Clipper
    steps:
    - id: C2.1
      label: Buka lagi
      page: page:app/campaigns
      url: app.{domain}/… (bookmark, link email, atau PWA)
      see: Langsung halaman yang dituju kalau sesi masih ada.
      do: Buka link.
      sys: proxy.ts menyegarkan sesi di server (cookie diset lewat header). JWT 10 menit; refresh token jalan diam-diam.
      nodes:
      - mod:auth
      next:
      - page:app/login
      next_note: Halaman tujuan.
      branch: Refresh gagal (logout di perangkat lain, akun di-ban, sesi dicabut) → app.{domain}/login?next=<path>.
    - id: C2.2
      label: Login di app
      page: page:app/login
      url: app.{domain}/login?next=…
      see: 'Form yang sama dengan accounts (komponen packages/auth): email → kode OTP, atau Google.'
      do: Ketik kode (atau Google).
      sys: Sama dengan C1.2 tapi di origin app; Google kembali ke app.{domain}/auth/callback. Ini juga jalur login PWA terinstal di iOS, karena cookie
        PWA terpisah dari Safari.
      nodes:
      - mod:auth
      - api:GET app/auth/callback
      - ext:supabase-identity
      next:
      - page:app/campaigns
      - page:accounts/onboarding
      - api:GET app/auth/callback
      next_note: Kembali ke next.
      branch: Akun baru dari sini (jarang) → accounts.{domain}/onboarding?next=….
    - id: C2.3
      label: Hub akun
      page: page:accounts/
      url: accounts.{domain}/?next=…
      see: 'Ringkasan: status KYC, jumlah rekening, MFA, consent; menu KYC, Rekening & penerima, Keamanan, Privasi & data; tombol Kembali ke app (dan Ke
        brand kalau anggota org).'
      do: Pilih menu atau kembali.
      sys: Data sendiri dari schema api identity (RLS data sendiri).
      nodes:
      - table:member.kyc_records
      - api:rpc identity.my_payout_methods
      next:
      - page:accounts/kyc
      - page:accounts/payout-methods
      - page:accounts/security
      - page:accounts/privacy
      - page:app/campaigns
      - page:brand/
      next_note: Halaman yang dipilih; Kembali → next atau app.{domain}/campaigns.
      branch: —
    - id: C2.4
      label: Privasi & data
      page: page:accounts/privacy
      url: accounts.{domain}/privacy
      see: Consent aktif (ToS, privasi, KYC, share_with_brand) + tombol cabut; Unduh data saya; Hapus akun.
      do: Cabut consent, unduh data, atau hapus akun (ketik username untuk konfirmasi).
      sys: 'Consent → api.record_consent (E-28). Unduh data → browser mengumpulkan data sendiri dari api identity + api core (RLS) + member-data (NIK &
        rekening milik sendiri didekripsi) jadi satu file JSON; tidak ada alur lintas DB baru. Hapus akun → delete-account (alur 7): tolak kalau saldo/payout
        masih berjalan, cabut semua sesi, hapus PII.'
      nodes:
      - api:rpc identity.record_consent
      - api:fn identity/member-data
      - api:fn identity/delete-account
      - api:fn core/bridge
      next:
      - page:www/
      next_note: Setelah hapus akun → {domain}/ dengan pesan Akun dihapus.
      branch: Masih ada saldo/payout berjalan → ditolak + instruksi tarik/tunggu dulu. Cabut share_with_brand → reward fisik yang butuh data penerima tidak
        bisa diklaim.
    - id: C2.5
      label: Pengaturan
      page: page:app/settings
      url: app.{domain}/settings
      see: Bahasa ID/EN, tema terang/gelap, email promosi (campaign baru, broadcast) on/off, notifikasi push on/off per perangkat.
      do: Ubah pengaturan.
      sys: Preferensi email → api.notification_prefs (E-34, RLS milik sendiri). Push → identity api.save_push_subscription (E-36). Email transaksional (OTP,
        KYC, payout) tidak bisa dimatikan.
      nodes:
      - table:ops.notification_prefs
      - api:rpc identity.save_push_subscription
      - table:member.push_subscriptions
      next:
      - page:app/campaigns
      next_note: Kembali ke halaman sebelumnya.
      branch: —
  J-C3:
    title: PWA terpasang & notifikasi push
    persona: Clipper
    steps:
    - id: C3.1
      label: Pasang app
      page: page:app/campaigns
      url: app.{domain}/campaigns (banner Pasang di layar utama)
      see: 'Android: tombol Pasang (prompt browser). iPhone: panduan Share → Add to Home Screen.'
      do: Pasang ke layar utama.
      sys: manifest.ts + service worker (sw.js) di apps/clipper. iOS 17.2+ menyalin cookie Safari saat dipasang, jadi user yang sudah login langsung masuk.
      nodes:
      - layout:clipper
      next:
      - page:app/login
      next_note: PWA terbuka di app.{domain}/campaigns.
      branch: Cookie tidak ikut (iOS lama) → app.{domain}/login di dalam PWA (J-C2 C2.2).
    - id: C3.2
      label: Izinkan notifikasi
      page: page:app/settings
      url: app.{domain}/settings
      see: 'Kartu Notifikasi push: Aktifkan.'
      do: Tap Aktifkan → izinkan di dialog browser.
      sys: Service worker membuat langganan push (VAPID publik) → identity api.save_push_subscription → E-36 (endpoint = pengenal perangkat, jadi di identity).
      nodes:
      - api:rpc identity.save_push_subscription
      - table:member.push_subscriptions
      next: []
      next_note: Status Aktif di perangkat ini.
      branch: 'Izin ditolak → tetap in-app + email. iPhone: push hanya untuk PWA yang sudah dipasang.'
    - id: C3.3
      label: Terima push
      page: ext:web-push
      url: Notifikasi sistem HP
      see: Mis. Payout sukses Rp150.000, Claim tinggal 6 jam.
      do: Tap notifikasi.
      sys: Worker notify → bridge identity send_push (kunci VAPID privat = secret Edge Function identity) bersama email (alur 4).
      nodes:
      - api:fn core/notify
      - api:fn identity/bridge
      next: []
      next_note: Membuka halaman tujuan di PWA (mis. app.{domain}/wallet).
      branch: Endpoint kedaluwarsa (410) → langganan dihapus otomatis.
  J-C4:
    title: Profil, Trust Score & leaderboard
    persona: Clipper
    steps:
    - id: C4.1
      label: Profil & Trust Score
      page: page:app/profile
      url: app.{domain}/profile
      see: Total views, earning, approval rate, Trust Score 0–100 + efeknya (campaign premium, cap lebih tinggi, hold lebih pendek, instant withdraw), riwayat
        perubahan skor.
      do: Lihat kenapa skor naik/turun.
      sys: api.my_profile + api.score_events (E-40, append-only) + api.submissions + api.wallet_balances. Skor dihitung ulang job trust-score tiap malam.
      nodes:
      - table:market.profiles
      - table:trust.score_events
      - job:trust-score
      next:
      - page:app/leaderboard
      next_note: Leaderboard.
      branch: Skor diturunkan karena fraud → bisa banding 1× lewat bantuan.
    - id: C4.2
      label: Leaderboard
      page: page:app/leaderboard
      url: app.{domain}/leaderboard
      see: Tab Minggu ini (global) dan Per campaign; posisi sendiri disorot.
      do: Pindah tab, buka campaign.
      sys: Materialized view leaderboard_weekly & leaderboard_campaign, di-refresh tiap jam (job leaderboard-refresh); baris campaign privat disaring RLS
        campaigns.
      nodes:
      - table:market.leaderboard_weekly
      - table:market.leaderboard_campaign
      - job:leaderboard-refresh
      next:
      - page:app/campaigns/[id]
      next_note: Detail campaign.
      branch: —
  J-C5:
    title: Ajak teman (referral)
    persona: Clipper
    steps:
    - id: C5.1
      label: Ambil link
      page: page:app/referral
      url: app.{domain}/referral
      see: Kode 8 karakter, tombol Bagikan link {domain}/?ref=<kode>, daftar teman (daftar, KYC, bonus aktif sampai), total bonus.
      do: Bagikan link.
      sys: api.my_referral_code (dibuat saat pertama diminta) + api.referrals (E-39, hanya milik pengundang).
      nodes:
      - api:rpc core.my_referral_code
      - table:market.referrals
      next:
      - page:www/
      next_note: Teman membuka {domain}/?ref=<kode>.
      branch: —
    - id: C5.2
      label: Teman daftar
      page: page:accounts/onboarding
      url: accounts.{domain}/onboarding?role=clipper
      see: Onboarding biasa (J-C1 C1.3).
      do: Teman menyelesaikan onboarding.
      sys: ensure_profile mencatat E-39 untuk profil baru; kode tidak dikenal atau milik sendiri diabaikan.
      nodes:
      - api:rpc core.ensure_profile
      - table:market.referrals
      next:
      - page:app/campaigns
      next_note: Teman masuk app.
      branch: Teman sudah punya akun → referral tidak dicatat.
    - id: C5.3
      label: Bonus
      page: page:app/referral
      url: app.{domain}/referral
      see: Status teman berubah Bonus aktif; bonus masuk wallet sebagai Pending → Tersedia.
      do: —
      sys: 'KYC teman disetujui → qualified_at. job:referral-bonus tiap malam: bonus = persentase config dari earning teman yang Tersedia hari itu, sampai
        bonus_until; jurnal referral_bonus dari akun platform (bukan potong earning teman).'
      nodes:
      - job:referral-bonus
      - table:finance.ledger_entries
      next:
      - page:app/wallet
      next_note: Wallet.
      branch: Teman satu NIK/rekening/perangkat dengan pengundang → fraud flag, bonus batal (FR-04, FR-05).
  J-C6:
    title: Reward non-tunai & instant withdraw
    persona: Clipper
    steps:
    - id: C6.1
      label: Klaim reward
      page: page:app/wallet/withdraw
      url: app.{domain}/wallet/withdraw (tab Reward)
      see: Saldo per reward type, field penerima (mis. User ID + Zone ID); alamat/HP diambil dari data penerima di accounts.
      do: Isi field, Klaim.
      sys: api.request_fulfillment → E-18. Field non-PII di core; alamat/HP di identity (E-29) lewat accounts.{domain}/payout-methods dan hanya dibagikan
        ke brand dengan consent share_with_brand.
      nodes:
      - api:rpc core.request_fulfillment
      - table:finance.fulfillments
      - table:member.recipient_details
      next:
      - page:accounts/payout-methods
      - page:app/wallet
      next_note: 'Wallet: status Diproses.'
      branch: Reward fisik tanpa data penerima → accounts.{domain}/payout-methods?next=….
    - id: C6.2
      label: Reward terkirim
      page: page:app/wallet
      url: app.{domain}/wallet (tab Reward)
      see: 'Pool kode: kode voucher muncul. Webhook: Terkirim otomatis. Ekspor manual: menunggu tim (J-A5).'
      do: Salin kode / cek akun game.
      sys: 'Worker core/fulfill: pool kode → pasang satu kode E-41 ke fulfillment; webhook → POST ke URL brand dengan tanda tangan (secret di Vault), gagal
        → retry tiap 5 menit (attempts, next_retry_at) → delivered → notifikasi.'
      nodes:
      - api:fn core/fulfill
      - table:finance.reward_codes
      - job:fulfillment-retry
      next: []
      next_note: —
      branch: Kode habis / webhook gagal terus → antre admin fulfillment (J-A5).
    - id: C6.3
      label: Instant withdraw
      page: page:app/wallet/withdraw
      url: app.{domain}/wallet/withdraw (Instant)
      see: Biaya flat (E-21 instant_withdraw_fee), estimasi masuk menit itu juga.
      do: Pilih Instant → Ajukan.
      sys: 'api.request_payout(channel instant) → E-17 + jurnal → bridge identity disburse: dekripsi rekening, kirim ke penyedia disbursement, callback
        → mark paid lewat bridge core (alur 11) → notifikasi.'
      nodes:
      - api:rpc core.request_payout
      - api:fn identity/disburse
      - ext:disbursement
      - table:finance.payouts
      next:
      - page:app/wallet
      next_note: 'Wallet: Ditarik.'
      branch: Trust Score di bawah ambang → opsi Instant nonaktif + alasannya. Penyedia gagal → payout failed, saldo kembali.
  J-B1:
    title: 'Brand baru self-serve: daftar → organisasi → campaign tayang'
    persona: Brand
    steps:
    - id: B1.1
      label: Untuk brand
      page: page:www/
      url: '{domain}/#brand'
      see: Cara kerja untuk brand, fee 15% + 5% di atas budget creator, contoh laporan, tombol Daftar sebagai brand dan Pakai paket managed.
      do: Tap Daftar sebagai brand.
      sys: Tidak ada.
      nodes: []
      next:
      - page:accounts/login
      next_note: accounts.{domain}/login?next=https://brand.{domain}/new.
      branch: 'Pakai paket managed → login & buat org seperti biasa, lalu di builder pilih Dibantu tim: isi brief mentah + unggah berkas brief (audience
        internal, folder internal/, tidak terlihat clipper) → draft service_mode managed antre di builder admin (J-A7); tim melengkapi, brand
        menyetujui di B1.7 lalu membayar (invoice managed_service).'
    - id: B1.2
      label: Login
      page: page:accounts/login
      url: accounts.{domain}/login?next=…
      see: 'Sama dengan login clipper: email kantor → kode OTP, atau Google.'
      do: Masuk.
      sys: Auth identity (C1.2). Akun yang sudah ada (mis. juga clipper) dipakai ulang.
      nodes:
      - mod:auth
      - ext:supabase-identity
      next:
      - page:accounts/onboarding
      next_note: accounts.{domain}/onboarding?role=brand&next=…
      branch: —
    - id: B1.3
      label: Onboarding brand
      page: page:accounts/onboarding
      url: accounts.{domain}/onboarding?role=brand&next=…
      see: Nama tampilan, username (diisi otomatis, bisa diubah), centang ToS brand + kebijakan privasi.
      do: Simpan.
      sys: ensure_profile → record_consent(tos_brand, privacy) → refreshSession → consent_ok.brand = true.
      nodes:
      - api:rpc core.ensure_profile
      - api:rpc identity.record_consent
      - fn:custom_access_token_hook
      next:
      - page:brand/new
      next_note: brand.{domain}/new.
      branch: Diundang ke org (J-B2) → langsung ke org itu, tanpa buat organisasi.
    - id: B1.4
      label: Buat organisasi
      page: page:brand/new
      url: brand.{domain}/new
      see: 'Nama brand, jenis (badan usaha / perorangan), centang agency; badan usaha: nama legal, NPWP 15/16 digit, alamat.'
      do: Buat organisasi.
      sys: 'api.create_org → E-02 status pending_verification + E-03 brand_owner. Perorangan: NPWP = NIK dan alamat pribadi tidak disimpan di core (constraint
        organizations_perorangan_no_pii); datanya dari KYC pemilik.'
      nodes:
      - api:rpc core.create_org
      - table:market.organizations
      - table:market.org_members
      next:
      - page:accounts/kyc
      - page:brand/[org]/campaigns
      next_note: brand.{domain}/[org]/campaigns dengan banner Menunggu verifikasi.
      branch: Perorangan → accounts.{domain}/kyc?next=https://brand.{domain}/[org]/campaigns (wajib sebelum invoice berfaktur).
    - id: B1.5
      label: Verifikasi org
      page: page:admin/users
      url: admin.{domain}/users (tab Org brand, J-A2)
      see: Brand melihat banner Menunggu verifikasi; boleh menyusun draft.
      do: Tim memeriksa NPWP (badan) atau KYC pemilik (perorangan).
      sys: api.manage_org verify → verified (verified_by, verified_at) → notifikasi org.verified; ditolak → alasan + perbaiki.
      nodes:
      - api:rpc core.manage_org
      - fn:enqueue_notification
      next: []
      next_note: Banner hilang; tombol Ajukan aktif.
      branch: Ditolak → brand memperbaiki data di brand.{domain}/[org]/settings lalu ajukan ulang.
    - id: B1.6
      label: Susun campaign
      page: page:brand/[org]/campaigns/new
      url: brand.{domain}/[org]/campaigns/new
      see: 'Builder 7 langkah (F-B02), bisa mulai dari template atau duplikat; simpan draft kapan saja. Langkah 2 Brief: teks brief, do/don''t,
        contoh konten (link), hashtag/mention/link wajib, durasi min–maks, label konten bersponsor, FAQ, aset (file/link); tombol Dibantu tim.'
      do: Isi langkah 1–7.
      sys: 'save_campaign (draft) → E-06 dengan kolom brief terstruktur, rate rule E-08, pool E-09, aset E-10 ke bucket campaign-covers /
        campaign-assets (berkas brief mentah di folder internal/: hanya anggota org + admin).'
      nodes:
      - comp:CampaignBuilder
      - api:rpc core.save_campaign
      - table:market.campaigns
      - table:market.campaign_assets
      - table:bucket.campaign-assets
      next: []
      next_note: 'Langkah terakhir: ringkasan biaya.'
      branch: Dibantu tim → service_mode managed, draft antre di J-A7; brand tetap bisa mengisi sendiri kapan saja.
    - id: B1.7
      label: Ringkasan & ajukan
      page: page:brand/[org]/campaigns/new
      url: brand.{domain}/[org]/campaigns/new (ringkasan)
      see: Budget creator + management fee 15% + admin fee 5% + pajak = total; jadwal; mode review.
      do: Ajukan.
      sys: 'save_campaign (submit): org harus verified → campaign in_review + invoice E-22 (kind campaign) → notifikasi Invoice terbit. Review isi oleh
        admin jalan paralel dengan pembayaran. Sejak diajukan brief terkunci (trigger campaigns_brief_frozen); yang masih bisa ditambah hanya FAQ.'
      nodes:
      - api:rpc core.save_campaign
      - table:finance.invoices
      - fn:enqueue_notification
      next:
      - page:brand/[org]/billing
      next_note: brand.{domain}/[org]/billing.
      branch: Org belum verified → tombol Ajukan nonaktif + alasan.
    - id: B1.8
      label: Bayar invoice
      page: page:brand/[org]/billing
      url: brand.{domain}/[org]/billing
      see: 'Invoice: rincian, QRIS (≤ Rp10 juta) atau rekening transfer + nomor referensi wajib; status Belum dibayar; unduh faktur setelah lunas.'
      do: Bayar dari m-banking.
      sys: Finance mencocokkan mutasi (J-A3) → confirm_invoice_payment → jurnal bank → pool → notifikasi Pembayaran diterima.
      nodes:
      - table:finance.invoices
      - ext:bank
      - api:rpc core.confirm_invoice_payment
      next:
      - page:brand/[org]/campaigns
      next_note: Invoice Lunas.
      branch: Nominal tidak cocok → finance menghubungi brand. Nomor referensi sama → ditolak sistem.
    - id: B1.9
      label: Review & tayang
      page: page:admin/campaigns
      url: admin.{domain}/campaigns (F-A02)
      see: Brand menerima notifikasi Campaign disetujui, lalu Campaign tayang.
      do: Admin cek hak aset, brief aman, dana masuk → approve.
      sys: 'record_review: approve hanya kalau invoice lunas → scheduled → job lifecycle membuat live pada start_at → notifikasi brand + clipper eligible
        (campaign.new).'
      nodes:
      - api:rpc core.record_review
      - job:lifecycle
      - fn:enqueue_notification
      next: []
      next_note: Brand → brand.{domain}/[org]/campaigns/[id] (J-B3).
      branch: Ditolak → alasan ke brand, campaign kembali draft untuk diperbaiki.
  J-B2:
    title: Tim brand & agency
    persona: Brand
    steps:
    - id: B2.1
      label: Buat link undangan
      page: page:brand/[org]/team
      url: brand.{domain}/[org]/team
      see: Daftar anggota + role; tombol Buat link undangan (pilih role).
      do: Buat link, bagikan sendiri lewat WhatsApp/email.
      sys: create_org_invite → E-30 (token_hash, kedaluwarsa). Tanpa email dari sistem.
      nodes:
      - api:rpc core.create_org_invite
      - table:market.org_invites
      next: []
      next_note: Penerima membuka accounts.{domain}/invite/[token].
      branch: Hanya brand_owner yang bisa membuat undangan.
    - id: B2.2
      label: Terima undangan
      page: page:accounts/invite/[token]
      url: accounts.{domain}/invite/[token]
      see: Nama org + role yang ditawarkan; kalau belum login, login dulu.
      do: Tap Terima.
      sys: 'accept_org_invite: profil E-01 dibuat dulu kalau belum ada, lalu E-03 (alur 5).'
      nodes:
      - api:rpc core.accept_org_invite
      - table:market.org_members
      next:
      - page:brand/
      - page:accounts/login
      next_note: brand.{domain}/.
      branch: Token kedaluwarsa atau sudah dipakai → minta link baru.
    - id: B2.3
      label: Tautkan agency
      page: page:brand/[org]/settings
      url: brand.{domain}/[org]/settings (Agency)
      see: 'Agency: kirim permintaan ke org klien. Klien (brand_owner): daftar permintaan + Setujui/Cabut.'
      do: Setujui tautan.
      sys: api.link_agency → E-38 disetujui brand_owner klien; anggota agency memegang role yang sama di org klien (ops.org_role); dicabut = revoked_at.
      nodes:
      - api:rpc core.link_agency
      - table:market.org_links
      next:
      - page:brand/
      next_note: Org klien muncul di pemilih org agency.
      branch: Dicabut → akses agency ke org klien hilang seketika (RLS).
  J-B3:
    title: Brand mengelola campaign berjalan sampai selesai
    persona: Brand
    steps:
    - id: B3.1
      label: Dashboard
      page: page:brand/[org]/campaigns/[id]
      url: brand.{domain}/[org]/campaigns/[id]
      see: Views valid, spend, sisa per pool, eCPM, jumlah klip & clipper, split platform, kurva harian, top klip, proyeksi budget habis vs deadline.
      do: Pantau.
      sys: Baca core lewat schema api (RLS anggota org); proyeksi dari snapshot & pool.
      nodes:
      - table:tracking.submissions
      - table:tracking.view_snapshots
      - table:finance.reward_pools
      next:
      - page:brand/[org]/review
      next_note: Review, kontrol, laporan.
      branch: 'Proyeksi < 50% → saran: naikkan rate, perpanjang, undang clipper, pin.'
    - id: B3.2
      label: Review klip
      page: page:brand/[org]/review
      url: brand.{domain}/[org]/review
      see: Antrean klip campaign mode review brand, embed, alasan standar.
      do: Approve/reject massal.
      sys: record_review oleh brand_owner/brand_manager; tidak direview 72 jam → auto-approve (job lifecycle).
      nodes:
      - api:rpc core.record_review
      - job:lifecycle
      next: []
      next_note: Clipper dikabari.
      branch: —
    - id: B3.3
      label: Kontrol campaign
      page: page:brand/[org]/campaigns/[id]
      url: brand.{domain}/[org]/campaigns/[id] (Kontrol)
      see: Pause/resume, perpanjang deadline, naikkan rate, top-up budget, akhiri lebih awal.
      do: Pilih aksi.
      sys: 'api.control_campaign: naikkan rate = rule lama ditutup (effective_to) + rule baru berlaku untuk views sesudahnya; top-up = invoice kind topup
        → bayar → pool bertambah; transisi status mengikuti S-01.'
      nodes:
      - api:rpc core.control_campaign
      - table:market.rate_rules
      - table:finance.invoices
      next:
      - page:brand/[org]/billing
      next_note: Top-up → billing.
      branch: Transisi tidak sah (mis. settled → live) → ditolak trigger state machine.
    - id: B3.4
      label: Undang clipper
      page: page:brand/[org]/campaigns/[id]
      url: brand.{domain}/[org]/campaigns/[id] (Undangan)
      see: 'Campaign privat: cari username, daftar undangan.'
      do: Undang.
      sys: api.invite_to_campaign → E-37 → notifikasi campaign.invited; campaign tampil hanya untuk yang diundang (RLS).
      nodes:
      - api:rpc core.invite_to_campaign
      - table:market.campaign_invites
      next: []
      next_note: —
      branch: Visibilitas level → otomatis terbuka untuk Trust Score ≥ ambang.
    - id: B3.5
      label: Pin campaign
      page: page:brand/[org]/campaigns/[id]
      url: brand.{domain}/[org]/campaigns/[id] (Pin)
      see: Pilih durasi pin, harga per minggu (REV-4).
      do: Pin.
      sys: api.buy_pin → invoice kind pinned (pin_until) → lunas → pinned_until diset → tampil di atas list clipper.
      nodes:
      - api:rpc core.buy_pin
      - table:finance.invoices
      next:
      - page:brand/[org]/billing
      next_note: Billing.
      branch: —
    - id: B3.6
      label: Laporan
      page: page:brand/[org]/campaigns/[id]
      url: brand.{domain}/[org]/campaigns/[id] (Laporan)
      see: Unduh CSV; Buat link read-only (berlaku 90 hari) + Cabut.
      do: Buat link, kirim ke atasan.
      sys: api.create_report_link → token sekali tampil, yang disimpan sha256-nya (E-33); atasan membuka {domain}/r/[token] tanpa login; PDF = cetak halaman
        itu.
      nodes:
      - api:rpc core.create_report_link
      - table:market.report_links
      - page:www/r/[token]
      next:
      - page:www/r/[token]
      next_note: '{domain}/r/[token].'
      branch: Link dicabut/kedaluwarsa → halaman Link tidak berlaku.
    - id: B3.7
      label: Selesai & sisa budget
      page: page:brand/[org]/billing
      url: brand.{domain}/[org]/billing (Sisa budget)
      see: Notifikasi Campaign selesai & laporan siap; sisa budget creator; pilih Rollover (kredit org tanpa fee baru) atau Refund (dikurangi biaya transfer).
      do: Pilih, konfirmasi dengan TOTP.
      sys: 'Butuh aal2. api.request_refund: rollover = jurnal ke akun org_credit; refund = E-35 requested → admin_finance lain approve & transfer (J-A3).'
