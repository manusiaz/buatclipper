      - api:rpc core.request_refund
      - table:finance.org_refunds
      - page:accounts/security
      next:
      - page:accounts/security
      next_note: Status refund di billing.
      branch: Belum punya TOTP → accounts.{domain}/security?next=… lalu kembali.
    - id: B3.8
      label: Template & duplikat
      page: page:brand/[org]/campaigns
      url: brand.{domain}/[org]/campaigns (Template)
      see: Simpan sebagai template, Duplikat campaign lama.
      do: Pilih template → buka builder terisi.
      sys: api.duplicate_campaign → campaign baru draft (template tetap draft, constraint campaigns_template_stays_draft).
      nodes:
      - api:rpc core.duplicate_campaign
      - table:market.campaigns
      next:
      - page:brand/[org]/campaigns/new
      next_note: Builder.
      branch: —
  J-A1:
    title: 'Tim internal: masuk admin'
    persona: Admin
    steps:
    - id: A1.1
      label: Login admin
      page: page:admin/login
      url: admin.{domain}/login
      see: Email → kode OTP → kode TOTP dari aplikasi authenticator.
      do: Login; login pertama mendaftarkan TOTP.
      sys: Akun admin terpisah dari akun clipper/brand; aal2 wajib; cookie host-only bernama lain. MFA admin didaftarkan di sini, bukan di accounts.{domain}
        (accounts menolak sesi admin).
      nodes:
      - mod:auth
      - ext:supabase-identity
      next:
      - page:admin/
      next_note: admin.{domain}/ (overview).
      branch: Akun non-admin → ditolak. TOTP salah → ulangi; terkunci → admin_super mereset.
    - id: A1.2
      label: Overview
      page: page:admin/
      url: admin.{domain}/
      see: GMV, revenue, campaign aktif, payout pending, ukuran fraud queue, kesehatan job tracking; sidebar ke semua menu.
      do: Pilih antrean kerja.
      sys: Baca core lewat fungsi admin (aal2).
      nodes:
      - table:finance.ledger_entries
      - table:finance.payouts
      - table:trust.fraud_flags
      next:
      - page:admin/campaigns
      - page:admin/review
      - page:admin/fraud
      - page:admin/users
      - page:admin/finance
      next_note: Menu sesuai role (admin_ops, admin_moderator, admin_finance, admin_support).
      branch: —
  J-A2:
    title: Verifikasi KYC & org brand
    persona: Admin
    steps:
    - id: A2.1
      label: Periksa KYC
      page: page:admin/users
      url: admin.{domain}/users
      see: 'Antrean KYC menunggu; detail: nama KTP, NIK tersamar, foto KTP (signed URL berumur pendek).'
      do: Bandingkan foto dengan data → Setujui atau Tolak + alasan.
      sys: Identity admin_read (akses tercatat E-24) → admin_kyc_decision (E-05). Core record_review mencatat keputusan (tanpa PII) dan mengirim notifikasi
        KYC disetujui/ditolak (in-app + email, alur 4).
      nodes:
      - api:rpc identity.admin_read
      - api:rpc identity.admin_kyc_decision
      - api:rpc core.record_review
      - fn:enqueue_notification
      next: []
      next_note: User melihat status baru di accounts.{domain}/kyc; claim kyc ikut saat JWT di-refresh.
      branch: NIK atau rekening ganda (FR-04) → tolak + tandai fraud.
    - id: A2.2
      label: Verifikasi org
      page: page:admin/users
      url: admin.{domain}/users (tab Org brand)
      see: 'Org pending_verification: badan → nama legal, NPWP, alamat; perorangan → status KYC pemilik.'
      do: Setujui atau tolak + alasan.
      sys: api.manage_org verify → verified/suspended + record_review target org → notifikasi org.verified / org.rejected.
      nodes:
      - api:rpc core.manage_org
      - api:rpc core.record_review
      - table:market.organizations
      next: []
      next_note: Brand bisa mengajukan campaign.
      branch: NPWP tidak valid → tolak; brand memperbaiki di pengaturan org.
  J-A3:
    title: Uang masuk & payout mingguan
    persona: Admin
    steps:
    - id: A3.1
      label: Konfirmasi bayar brand
      page: page:admin/finance
      url: admin.{domain}/finance (tab Pembayaran masuk)
      see: Invoice belum lunas + form nominal, waktu, nomor referensi.
      do: Cocokkan dengan mutasi rekening di internet banking → Konfirmasi.
      sys: confirm_invoice_payment → jurnal bank_clearing → campaign_pool; nomor referensi sama ditolak; notifikasi Pembayaran diterima ke brand.
      nodes:
      - api:rpc core.confirm_invoice_payment
      - ext:bank
      - table:finance.invoices
      next: []
      next_note: Campaign siap direview (J-B1 B1.7).
      branch: Nominal kurang → tahan, hubungi brand.
    - id: A3.2
      label: Buat & approve batch
      page: page:admin/finance
      url: admin.{domain}/finance (tab Payout)
      see: Payout requested sampai cut-off, top earner, flag fraud.
      do: admin_finance A membuat batch dan menahan yang mencurigakan; admin_finance B approve.
      sys: create_payout_batch → E-26; approve ditolak kalau approved_by = created_by; aal2.
      nodes:
      - api:rpc core.create_payout_batch
      - table:finance.payout_batches
      next: []
      next_note: Tombol Export CSV aktif.
      branch: 'Pembuat batch tidak bisa menyetujui batchnya sendiri: selalu dua orang (§4, §15.5 alur 3).'
    - id: A3.3
      label: Export CSV
      page: page:admin/finance
      url: admin.{domain}/finance → Export CSV
      see: Link unduh CSV (berlaku 15 menit) + daftar payout yang ditahan beserta alasannya.
      do: Unduh CSV.
      sys: pii-export (identity) → bridge core get_batch → cek pemilik rekening = pemilik payout dan nama = nama KYC → CSV di bucket pii-exports → attach_export
        menahan yang tidak lolos; akses tercatat.
      nodes:
      - api:fn identity/pii-export
      - api:fn core/bridge
      - table:bucket.pii-exports
      next: []
      next_note: Internet banking bisnis (luar sistem).
      branch: Rekening diganti user saat batch berjalan → payout itu ditahan (R-15).
    - id: A3.4
      label: Transfer & tandai paid
      page: page:admin/finance
      url: admin.{domain}/finance → Tandai paid
      see: Form unggah bukti transfer per batch.
      do: Upload CSV di internet banking, tunggu hasil, unggah bukti, Tandai paid.
      sys: pii-export menyimpan bukti di payout-proofs + attach_proof; mark_batch_paid hanya untuk payout di CSV → jurnal Ditarik → notifikasi Payout sukses/gagal
        ke clipper.
      nodes:
      - ext:bank
      - table:bucket.payout-proofs
      - api:rpc core.mark_batch_paid
      - fn:enqueue_notification
      next: []
      next_note: Rekap PPh 21 dari pii-export; rekonsiliasi harian berjalan otomatis.
      branch: Sebagian gagal di bank → tandai failed → saldo kembali ke clipper (S-05).
    - id: A3.5
      label: Rekonsiliasi harian
      page: page:admin/
      url: admin.{domain}/ (alert)
      see: Alert kalau ada selisih ledger vs mutasi atau ID lintas DB yatim.
      do: Tindak lanjuti alert.
      sys: 'job:reconcile-daily: ledger vs mutasi; ID yatim dicek lewat bridge identity check_ids (alur 10).'
      nodes:
      - job:reconcile-daily
      - api:fn identity/bridge
      next: []
      next_note: —
      branch: Selisih ≠ 0 → alert admin (F-X01).
    - id: A3.6
      label: Refund brand
      page: page:admin/finance
      url: admin.{domain}/finance (tab Refund)
      see: 'Refund requested: org, campaign, jumlah, biaya transfer.'
      do: admin_finance lain approve → transfer → unggah bukti → Tandai paid.
      sys: 'E-35: approved_by ≠ requested_by (constraint); bukti di bucket payout-proofs (identity); jurnal refund.'
      nodes:
      - table:finance.org_refunds
      - api:fn identity/pii-export
      next: []
      next_note: Brand menerima notifikasi refund.
      branch: —
    - id: A3.7
      label: Instant gagal
      page: page:admin/finance
      url: admin.{domain}/finance (tab Instant)
      see: Instant payout processing/failed + respons penyedia.
      do: Tindak lanjuti yang menggantung.
      sys: Callback penyedia → identity disburse → bridge core mark paid/failed (alur 11); failed → saldo kembali (S-05).
      nodes:
      - api:fn identity/disburse
      - table:finance.payouts
      next: []
      next_note: —
      branch: —
  J-A4:
    title: Moderasi, banding & fraud
    persona: Admin
    steps:
    - id: A4.1
      label: Moderasi submisi
      page: page:admin/review
      url: admin.{domain}/review
      see: Antrean berfilter, preview embed, histori banding.
      do: Approve/reject massal dengan alasan standar; putus banding.
      sys: record_review → S-03 + notifikasi submisi approved/rejected.
      nodes:
      - api:rpc core.record_review
      - table:tracking.submissions
      next: []
      next_note: Clipper melihat hasil di app.{domain}/tasks.
      branch: —
    - id: A4.2
      label: Fraud queue
      page: page:admin/fraud
      url: admin.{domain}/fraud
      see: Sinyal FR-xx per submisi/akun dengan skor.
      do: Tahan, reverse earning, suspend, atau ban.
      sys: 'resolve_fraud_flag → reverse_earning / status E-01 (suspend 30 hari atau banned) + riwayat Trust Score E-40. Ban juga memanggil identity admin-auth:
        ban_duration → refresh token ditolak; access token yang sudah terbit tetap sah ≤ 10 menit, jadi fungsi claim/withdraw di core menolak lewat status
        E-01.'
      nodes:
      - api:rpc core.resolve_fraud_flag
      - fn:reverse_earning
      - table:market.profiles
      - api:fn identity/admin-auth
      - table:trust.score_events
      next: []
      next_note: Clipper menerima notifikasi; ban = cabut semua sesi (J-C2 C2.1).
      branch: —
  J-A5:
    title: Fulfillment reward non-tunai
    persona: Admin
