      url: admin.{domain}/campaigns/new?campaign=[id]
      see: Builder yang sama dengan brand (packages/campaign-builder) + override fee; brief mentah & berkas internal di panel samping.
      do: Lengkapi 7 langkah (brief terstruktur, rate, budget, eligibility, jadwal) → Kirim ke brand.
      sys: save_campaign (admin_ops, aal2) mengisi kolom brief terstruktur E-06, rate E-08, pool E-09; invoice managed_service E-22; notifikasi ke brand bahwa draft siap disetujui.
