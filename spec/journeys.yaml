      label: Antrean paket managed
      page: page:admin/campaigns
      url: admin.{domain}/campaigns (tab Paket managed)
      see: Draft service_mode managed, terlama di atas — org, PIC, brief mentah, berkas internal (signed URL), tanggal minta.
      do: Ambil → buka di builder admin.
      sys: api.campaigns (service_mode managed, status draft; index campaigns_managed_queue_idx) + api.campaign_assets audience internal; admin_ops aal2.
