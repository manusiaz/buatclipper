# journeys.yaml — sumber tunggal journey end-to-end produk penuh (PRD §6, bagian Journey di KNOWLEDGE_GRAPH.md, gambar journey)
# Tiap langkah menunjuk node graph (page/api/ext). `next` = node yang dituju user dari langkah ini (jadi edge routes-to).
rules:
- 'Login clipper dari browser: accounts.{domain}/login. Kalau sesi habis saat di app (atau dari PWA terinstal): app.{domain}/login. Brand: accounts.{domain}/login?next=https://brand.{domain}/…
  . Admin: hanya admin.{domain}/login, akun terpisah.'
- Parameter next hanya diterima kalau URL https ke {domain}, app.{domain}, brand.{domain}, atau accounts.{domain}. Selain itu (termasuk admin.{domain} dan
  domain luar) diganti default app.{domain}/campaigns, supaya halaman login tidak bisa dipakai untuk open redirect.
- 'Belum login: app → app.{domain}/login?next=<path>; brand → accounts.{domain}/login?next=<URL brand>; accounts → /login?next=<path>; admin → admin.{domain}/login.'
- 'Sesudah login, guard tiap app membaca claim consent_ok di JWT (diisi hook identity): app.{domain} butuh consent_ok.clipper (ToS clipper + privasi versi
  terbaru + pernyataan umur 18+), brand.{domain} butuh consent_ok.brand (ToS brand + privasi). Belum → accounts.{domain}/onboarding?role=clipper|brand&next=….
  Versi ToS baru terbit → claim jadi false paling lama 10 menit kemudian → user diminta setuju ulang.'
- 'Keluar: accounts, app, dan brand memanggil signOut lalu ke {domain}/; cookie .{domain} hilang untuk ketiganya sekaligus. Admin keluar ke admin.{domain}/login.'
- Link di email notifikasi langsung ke halaman tujuan (mis. app.{domain}/wallet). Kalau sesi habis, guard membawa ke login lalu kembali ke halaman itu.
- 'Redirect URL yang didaftarkan di Auth identity: accounts.{domain}/auth/callback, accounts.{domain}/auth/confirm, app.{domain}/auth/callback, plus versi
  domain staging.'
- Aksi yang menggerakkan uang brand (refund, rollover) dan semua halaman admin butuh aal2. Brand yang belum punya TOTP dibawa ke accounts.{domain}/security?next=<halaman>;
  admin mendaftarkan TOTP di admin.{domain}/login.
- Link referral {domain}/?ref=<kode> menyimpan kode di cookie .{domain} selama 30 hari; onboarding clipper mengirimnya ke ensure_profile (hanya untuk profil
  baru).
