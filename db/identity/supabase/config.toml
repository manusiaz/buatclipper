# Project identity (login + PII). Hanya kunci yang sudah dicek ke docs CLI; setelan Auth lain (SMTP Resend, Turnstile,
# template email, rate limit, MFA, redirect URL, custom domain) diatur di Dashboard/Management API (PRD §15.10).
project_id = "clipper-identity"

[api]
schemas = ["api"]
extra_search_path = ["extensions"]

[auth]
jwt_expiry = 600

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/member/custom_access_token_hook"

[storage.buckets.kyc-docs]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.pii-exports]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["text/csv"]

[storage.buckets.payout-proofs]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png"]

# Diff schema deklaratif memakai pg-delta. Engine lama (migra) membuang security_invoker dari view: view schema api jadi
# melewati RLS. Jangan matikan.
[experimental.pgdelta]
enabled = true

# Semua fungsi mengautentikasi pemanggil di kode (JWT identity lewat JWKS, HMAC bridge, atau apikey cron) — PRD §15.6.
[functions.bridge]
verify_jwt = false
[functions.member-data]
verify_jwt = false
[functions.pii-export]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.admin-auth]
verify_jwt = false
[functions.disburse]
verify_jwt = false
