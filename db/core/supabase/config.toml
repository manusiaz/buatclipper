# Project core (campaign, tracking, uang; tanpa PII). Hanya kunci yang sudah dicek ke docs CLI. Third-Party Auth → Custom OIDC
# (issuer identity) tidak tersedia di CLI: didaftarkan lewat Dashboard/Management API (PRD §15.6).
project_id = "clipper-core"

# Port lokal digeser dari default (dipakai stack identity) supaya dua stack jalan bareng.
[api]
port = 55321
schemas = ["api"]
extra_search_path = ["extensions"]

[db]
port = 55322
shadow_port = 55320

[db.pooler]
port = 55329

[studio]
port = 55323

[local_smtp]
port = 55324

[analytics]
port = 55327

[edge_runtime]
inspector_port = 8084

# Signup & provider core dimatikan: satu-satunya penerbit login = identity (§15.6). Key dev sama dengan identity.
[auth]
enable_signup = false
signing_keys_path = "./dev-keys/signing_keys.json"

[auth.email]
enable_signup = false

[storage.buckets.campaign-covers]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.campaign-assets]
public = false
file_size_limit = "500MiB"
allowed_mime_types = ["video/mp4", "video/quicktime", "image/jpeg", "image/png", "image/webp", "audio/mpeg", "audio/wav", "application/pdf"]

[storage.buckets.avatars]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

# Diff schema deklaratif memakai pg-delta. Engine lama (migra) membuang security_invoker dari view: view schema api jadi
# melewati RLS. Jangan matikan.
[experimental.pgdelta]
enabled = true

[functions.social]
verify_jwt = false
[functions.track-worker]
verify_jwt = false
[functions.refresh-tokens]
verify_jwt = false
[functions.notify]
verify_jwt = false
[functions.bridge]
verify_jwt = false
[functions.fulfill]
verify_jwt = false

# Secret Edge Function untuk stack LOKAL saja (scripts/dev-stack.sh mengisi env-nya). Produksi: supabase secrets set.
[edge_runtime.secrets]
IDENTITY_ISSUER = "env(IDENTITY_ISSUER)"
IDENTITY_JWKS_URL = "env(IDENTITY_JWKS_URL)"
APP_ORIGINS = "env(APP_ORIGINS)"
SOCIAL_REDIRECT_ALLOWLIST = "env(SOCIAL_REDIRECT_ALLOWLIST)"
UNSUBSCRIBE_SECRET = "env(UNSUBSCRIBE_SECRET)"
UNSUBSCRIBE_BASE_URL = "env(UNSUBSCRIBE_BASE_URL)"
IDENTITY_FUNCTIONS_URL = "env(IDENTITY_FUNCTIONS_URL)"
BRIDGE_SECRET_CORE_TO_IDENTITY = "env(BRIDGE_SECRET_CORE_TO_IDENTITY)"
BRIDGE_SECRET_IDENTITY_TO_CORE = "env(BRIDGE_SECRET_IDENTITY_TO_CORE)"
TIKTOK_CLIENT_KEY = "env(TIKTOK_CLIENT_KEY)"
TIKTOK_CLIENT_SECRET = "env(TIKTOK_CLIENT_SECRET)"
META_APP_ID = "env(META_APP_ID)"
META_APP_SECRET = "env(META_APP_SECRET)"
GOOGLE_CLIENT_ID = "env(GOOGLE_CLIENT_ID)"
GOOGLE_CLIENT_SECRET = "env(GOOGLE_CLIENT_SECRET)"
THREADS_APP_ID = "env(THREADS_APP_ID)"
THREADS_APP_SECRET = "env(THREADS_APP_SECRET)"
FACEBOOK_APP_ID = "env(FACEBOOK_APP_ID)"
FACEBOOK_APP_SECRET = "env(FACEBOOK_APP_SECRET)"
X_CLIENT_ID = "env(X_CLIENT_ID)"
X_CLIENT_SECRET = "env(X_CLIENT_SECRET)"
